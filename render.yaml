services:
  - type: web
    name: yuvatime-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o api ./cmd/api
    startCommand: ./api
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false   # Set this manually in the Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false   # Set this manually in the Render dashboard
    healthCheckPath: /api/inventory/products
    autoDeploy: true
    plan: free
